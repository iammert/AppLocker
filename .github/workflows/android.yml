name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build, test and lint
        run: ./gradlew assembleDevDebug testDevDebugUnitTest lintDevDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: '**/build/reports/'
